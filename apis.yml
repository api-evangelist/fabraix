aid: fabraix
name: Fabraix
description: >-
  Fabraix builds red-teaming AI agents that continuously find security
  vulnerabilities in customer-facing AI systems. Its flagship product, Nyx,
  autonomously discovers exploits across chat, voice, browser, and coding agents
  without needing source-code access, drawing on a library of more than 10,000
  jailbreaks and adaptive attack strategies that pursue promising approaches
  across hundreds of interactions. Fabraix also created ACE (Adversarial Cost to
  Exploit), a game-theoretic benchmark that measures AI security by the cost of
  a successful attack, enabling continuous, lower-cost vulnerability testing that
  re-assesses systems with each update. Fabraix is a Y Combinator (Summer 2026)
  company. This profile is maintained by the API Evangelist network; no public
  API, developer documentation, or machine-readable surface has been published
  by Fabraix at this time.
